name: Sincronizar presentaciones por tema
on:
  push:
    branches:
      - main
    paths:
      - 'temas/**/tema-*.md'
      - 'temas/**/imagenes/**'
      - 'temas/**/img/**'
      - 'scripts/generar_presentaciones.py'
      - '.github/workflows/actualizar-presentaciones.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: presentaciones-main
  cancel-in-progress: false
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install python-pptx markdown beautifulsoup4 cairosvg
      - name: Generar solo temas con cambios
        run: python scripts/generar_presentaciones.py
      - name: Registrar cambios en Markdown y presentaciones
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temas/
          if git diff --cached --quiet; then
            echo "No hay presentaciones pendientes"
            exit 0
          fi
          git commit -m "Sincronizar HTML y PPTX de temas modificados [skip ci]"
          git push
