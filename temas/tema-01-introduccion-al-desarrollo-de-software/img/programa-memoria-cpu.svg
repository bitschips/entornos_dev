"/><text x="1006.5" y="332.7" text-anchor="middle" font-size="28" font-weight="750" fill="#fff" font-family="Arial,sans-serif">Proceso</text><text x="1006.5" y="374.2" text-anchor="middle" font-size="20" fill="#f1f9ff" font-family="Arial,sans-serif">CPU</text><rect x="1164" y="258" width="237" height="166" rx="22" fill="#198781" stroke="#7ad9e1" stroke-width="2"/><text x="1282.5" y="332.7" text-anchor="middle" font-size="28" font-weight="750" fill="#fff" font-family="Arial,sans-serif">Salida</text><text x="1282.5" y="374.2" text-anchor="middle" font-size="20" fill="#f1f9ff" font-family="Arial,sans-serif">Terminal / pantalla</text><line x1="299" y1="342" x2="333" y2="342" stroke="#81dce6" stroke-width="7" marker-end="url(#arrow)"/><line x1="575" y1="342" x2="609" y2="342" stroke="#81dce6" stroke-width="7" marker-end="url(#arrow)"/><line x1="851" y1="342" x2="885" y2="342" stroke="#81dce6" stroke-width="7" marker-end="url(#arrow)"/><line x1="1127" y1="342" x2="1161" y2="342" stroke="#81dce6" stroke-width="7" marker-end="url(#arrow)"/><text x="74" y="535" font-size="25" fill="#ffdfad" font-family="Arial,sans-serif">La CPU interpreta instrucciones máquina; no entiende directamente el texto de Python o C.</text><text x="72" y="656" font-size="21" fill="#c5e5ee" font-family="Arial,sans-serif">Entornos de Desarrollo · 1.º DAW</text></svg>