<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-label="¿Qué hace GCC con un programa C?">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c2541"/><stop offset="1" stop-color="#135973"/></linearGradient><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L11 6 L0 12Z" fill="#8fe1e5"/></marker></defs>
<rect width="1500" height="780" fill="url(#bg)"/>
<text x="75" y="83" fill="#ffffff" font-size="42" font-weight="bold" font-family="Arial,sans-serif">¿Qué hace GCC con un programa C?</text>
<text x="75" y="127" fill="#c7e8ef" font-size="23" font-family="Arial,sans-serif">Etapas simplificadas de compilación nativa</text>
<rect x="50" y="229" width="247" height="140" rx="20" fill="#176c7a" stroke="#8fe1e5" stroke-width="2"/><text x="173.5" y="290.6" font-family="Arial,sans-serif" font-size="25" text-anchor="middle" fill="#ffffff" font-weight="bold">Fuente C</text><text x="173.5" y="329.8" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#e5f6f8">hola.c</text><rect x="343" y="229" width="247" height="140" rx="20" fill="#245a83" stroke="#8fe1e5" stroke-width="2"/><text x="466.5" y="290.6" font-family="Arial,sans-serif" font-size="25" text-anchor="middle" fill="#ffffff" font-weight="bold">Preprocesador</text><text x="466.5" y="329.8" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#e5f6f8">-E → hola.i</text><rect x="636" y="229" width="247" height="140" rx="20" fill="#176c7a" stroke="#8fe1e5" stroke-width="2"/><text x="759.5" y="290.6" font-family="Arial,sans-serif" font-size="25" text-anchor="middle" fill="#ffffff" font-weight="bold">Compilador</text><text x="759.5" y="329.8" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#e5f6f8">-S → hola.s</text><rect x="929" y="229" width="247" height="140" rx="20" fill="#245a83" stroke="#8fe1e5" stroke-width="2"/><text x="1052.5" y="290.6" font-family="Arial,sans-serif" font-size="25" text-anchor="middle" fill="#ffffff" font-weight="bold">Ensamblador</text><text x="1052.5" y="329.8" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#e5f6f8">-c → hola.o</text><rect x="1222" y="229" width="247" height="140" rx="20" fill="#176c7a" stroke="#8fe1e5" stroke-width="2"/><text x="1345.5" y="290.6" font-family="Arial,sans-serif" font-size="25" text-anchor="middle" fill="#ffffff" font-weight="bold">Enlazador</text><text x="1345.5" y="329.8" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#e5f6f8">hola + bibliotecas</text><line x1="300" y1="298" x2="337" y2="298" stroke="#8fe1e5" stroke-width="5" marker-end="url(#ar)"/><line x1="593" y1="298" x2="630" y2="298" stroke="#8fe1e5" stroke-width="5" marker-end="url(#ar)"/><line x1="886" y1="298" x2="923" y2="298" stroke="#8fe1e5" stroke-width="5" marker-end="url(#ar)"/><line x1="1179" y1="298" x2="1216" y2="298" stroke="#8fe1e5" stroke-width="5" marker-end="url(#ar)"/><rect x="220" y="472" width="1060" height="106" rx="20" fill="#163f5a" stroke="#f9ce79" stroke-width="2"/><text x="750" y="514" font-size="28" font-family="Arial,sans-serif" fill="#f9ce79" font-weight="bold" text-anchor="middle">Después: cargador del sistema operativo → proceso → CPU</text><text x="750" y="552" font-size="22" font-family="Arial,sans-serif" fill="#f4fbff" text-anchor="middle">El ejecutable nativo depende de la plataforma y sus bibliotecas</text>
<text x="75" y="739" fill="#c7e8ef" font-size="20" font-family="Arial,sans-serif">Entornos de Desarrollo · Tema 2 · v1.0.0</text>
</svg>